<!doctype html>
<html>
<head>
<title>Sanju Jeans House</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:35px 20px;
}

header img{
  width:180px;
  display:block;
  margin:0 auto 15px;
}

header h1{
  margin:10px 0;
  font-size:32px;
}

header p{
  font-size:18px;
}

.card{
  background:white;
  margin:25px auto;
  padding:30px 20px;
  border-radius:15px;
  max-width:1000px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.collection{
  display:block;
}

.collection img{
  width:30%;
  margin:10px;
  border-radius:12px;
}

.product{
  display:inline-block;
  width:28%;
  margin:1%;
  vertical-align:top;
}

.product img{
  width:100%;
  border-radius:12px;
}

.product h3{
  margin:12px 0 6px;
}

.product p{
  font-size:18px;
  font-weight:bold;
}

a{
  color:#111;
  font-weight:bold;
}

@media(max-width:600px){
  .collection img,
  .product{
    width:90%;
    margin:15px auto;
    display:block;
  }

  header h1{
    font-size:26px;
  }
}
</style>
</head>
<body>
<header>
<img src="sanju-logo.jpeg" alt="Sanju Jeans House Logo" style="width:180px;display:block;margin:0 auto 15px;">
<h1>Sanju Jeans House</h1>
<p>Premium Men's Denim</p>
</header>
<div class="card collection">
<h2>Our Jeans Collection</h2>

<div class="product">
<img src="jeans-black.jpg" alt="Black Jeans">
<h3>Black Jeans</h3>
<p>₹1,499</p>
</div>

<div class="product">
<img src="jeans-blue.jpg" alt="Blue Jeans">
<h3>Blue Jeans</h3>
<p>₹1,599</p>
</div>

<div class="product">
<img src="jeans-lightblue.jpg" alt="Light Blue Jeans">
<h3>Light Blue Jeans</h3>
<p>₹1,599</p>
</div>

<p>Premium Men's Denim</p>
</div>



<div class="card">
<h2>Contact Us</h2>
<p>Sanju Jeans House</p>
<p>📱 WhatsApp: <a href="https://wa.me/917041448501">Chat on WhatsApp</a></p>
<p>📞 Call: <a href="tel:+917041448501">+91 7041448501</a></p>
</div>
</body>
</html>
