<!doctype html>
<html>
<head>
<title>Sanju Jeans House</title>
<style>
body{margin:0;font-family:Arial;text-align:center;background:#eee}
header{background:#111;color:white;padding:30px}
.hero{padding:50px;background:#222;color:white}
.card{background:white;margin:20px;padding:30px;border-radius:15px}
  .collection img{width:30%;margin:10px;border-radius:10px;}
@media (max-width:600px){.collection img{width:90%;margin:10px auto;display:block;}}
  .product{display:inline-block;width:28%;margin:1%;vertical-align:top}
.product img{width:100%;border-radius:10px}
@media(max-width:600px){.product{display:block;width:90%;margin:15px auto}}
</style>
</head>
<body>
<header>
<img src="sanju-logo.jpeg" alt="Sanju Jeans House Logo" style="width:180px;display:block;margin:0 auto 15px;">
<h1>Sanju Jeans House</h1>
<p>Premium Men's Denim</p>
</header>
<div class="card collection">
<h2>Our Jeans Collection</h2>

<div class="product">
<img src="jeans-black.jpg" alt="Black Jeans">
<h3>Black Jeans</h3>
<p>₹1,499</p>
</div>

<div class="product">
<img src="jeans-blue.jpg" alt="Blue Jeans">
<h3>Blue Jeans</h3>
<p>₹1,599</p>
</div>

<div class="product">
<img src="jeans-lightblue.jpg" alt="Light Blue Jeans">
<h3>Light Blue Jeans</h3>
<p>₹1,599</p>
</div>

<p>Premium Men's Denim</p>
</div>



<div class="card">
<h2>Contact Us</h2>
<p>Sanju Jeans House</p>
</div>
</body>
</html>
